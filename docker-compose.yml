services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 5palasdoce-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: 5palasdoce-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
